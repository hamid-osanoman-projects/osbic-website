<!doctype html>
<html lang="en">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <link rel="manifest" href="/manifest.json" />

    <!-- Mobile Meta -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Canonical -->
    <link rel="canonical" href="https://osbic.net" />

    <!-- Open Graph -->
    <meta property="og:title" content="OSBIC — Oman Business & Visa Services" />

    <meta name="twitter:image" content="https://osbic.net/og-cover.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />

    <!-- JSON-LD -->

      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "OSBIC",
      "url": "https://osbic.net",
      "logo": "https://osbic.net/favicon.png",
      "description": "Business setup in Oman, company registration, investor visa services & PRO assistance.",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "OM"
      },
      "sameAs": [
        "https://instagram.com/YOUR_INSTAGRAM",
        "https://linkedin.com/company/YOUR_COMPANY"
      ]
    }
    </script>
  </head>

  <body class="font-sans bg-white text-gray-900">
